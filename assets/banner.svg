<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1983 787" role="img" aria-label="Cold outreach. Copy and hooks. More replies. More meetings. Done. An AI skill by enso.">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F04E23"/>
      <stop offset="45%" stop-color="#EC1E79"/>
      <stop offset="100%" stop-color="#8B2FC9"/>
    </linearGradient>
    <linearGradient id="brandV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F04E23"/>
      <stop offset="50%" stop-color="#EC1E79"/>
      <stop offset="100%" stop-color="#8B2FC9"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="7" fill="#F5B8A0" opacity="0.55"/>
    </pattern>
    <radialGradient id="fadeTR" cx="100%" cy="0%" r="75%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fadeBL" cx="0%" cy="100%" r="75%">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="55%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="maskTR"><rect width="1983" height="787" fill="url(#fadeTR)"/></mask>
    <mask id="maskBL"><rect width="1983" height="787" fill="url(#fadeBL)"/></mask>
  </defs>

  <!-- background -->
  <rect width="1983" height="787" fill="#FBEFE1"/>
  <rect width="1983" height="787" fill="url(#dots)" mask="url(#maskTR)"/>
  <rect width="1983" height="787" fill="url(#dots)" mask="url(#maskBL)"/>

  <!-- AI SKILL chip -->
  <g transform="translate(103,95) rotate(-4)">
    <rect x="0" y="0" rx="16" width="224" height="58" fill="#E4D6F8"/>
    <text x="34" y="40" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="27" letter-spacing="2" fill="#6B21B6">⚡ AI SKILL</text>
  </g>
  <g stroke="#6B21B6" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M72 92 l22 14"/><path d="M64 116 l24 6"/><path d="M84 70 l14 20"/>
  </g>

  <!-- headline -->
  <text x="118" y="330" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="172" letter-spacing="-6" fill="#141414">Cold outreach<tspan fill="#8B2FC9">.</tspan></text>
  <text x="118" y="490" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="168" fill="url(#brand)">copy</text>
  <path d="M122 516 C 240 500, 380 532, 470 512" stroke="url(#brand)" stroke-width="9" fill="none" stroke-linecap="round"/>
  <text x="500" y="490" font-family="Helvetica, Arial, sans-serif" font-weight="800" font-size="172" letter-spacing="-6" fill="#141414">&amp; hooks<tspan fill="#F04E23">.</tspan></text>

  <!-- subline pill -->
  <g transform="translate(103,556)">
    <rect x="0" y="0" rx="26" width="950" height="102" fill="#FFFFFF" opacity="0.92"/>
    <text x="42" y="68" font-family="Helvetica, Arial, sans-serif" font-size="46">🚀</text>
    <text x="130" y="67" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="45" fill="#141414">More replies. <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="url(#brand)">More meetings.</tspan> Done.</text>
    <path d="M786 84 C 830 76, 872 90, 908 80" stroke="#F04E23" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- divider shadow under wordmark -->
  <ellipse cx="1560" cy="580" rx="380" ry="10" fill="#E4CDB9" opacity="0.6"/>

  <!-- enso wordmark -->
  <text x="1560" y="510" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="300" letter-spacing="-14" fill="url(#brandV)">enso</text>

  <!-- hooks sticker -->
  <g transform="translate(1680,180) rotate(4)">
    <rect x="0" y="0" rx="16" width="230" height="104" fill="#E4D6F8"/>
    <text x="26" y="44" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="27" letter-spacing="1" fill="#5B21A6">⚡ HOOKS THAT</text>
    <text x="26" y="84" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="27" letter-spacing="1" fill="#5B21A6">OPEN DOORS</text>
  </g>
  <path d="M1925 300 C 1945 330, 1935 360, 1910 380" stroke="#8B2FC9" stroke-width="5" fill="none" stroke-linecap="round" marker-end="none"/>
  <path d="M1910 380 l 14 -6 M1910 380 l 2 -16" stroke="#8B2FC9" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- envelope -->
  <g transform="translate(1770,640) rotate(-6)">
    <rect x="0" y="0" rx="10" width="120" height="84" fill="none" stroke="#8B2FC9" stroke-width="6"/>
    <path d="M4 8 L60 50 L116 8" fill="none" stroke="#8B2FC9" stroke-width="6" stroke-linecap="round"/>
    <circle cx="118" cy="4" r="16" fill="#F04E23"/>
  </g>
  <g stroke="#8B2FC9" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M1728 640 l20 12"/><path d="M1720 664 l22 6"/>
  </g>

  <!-- sparkles -->
  <g fill="#8B2FC9">
    <path d="M905 120 l7 22 22 7 -22 7 -7 22 -7 -22 -22 -7 22 -7z"/>
    <circle cx="945" cy="105" r="5"/>
  </g>
  <path d="M840 660 l6 19 19 6 -19 6 -6 19 -6 -19 -19 -6 19 -6z" fill="#F04E23"/>

  <!-- arrow bottom left -->
  <path d="M255 700 C 300 715, 330 690, 355 660" stroke="#8B2FC9" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M355 660 l-16 2 M355 660 l-4 16" stroke="#8B2FC9" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="243" cy="700" r="7" fill="none" stroke="#8B2FC9" stroke-width="5"/>
</svg>
